# Netlify 静态站点配置（绑定你自己的域名）
# 用法：
#   1) 安装并登录： npm i -g netlify-cli && netlify login
#   2) 部署：       netlify deploy --prod --dir dist
#   3) 在 Netlify 控制台 Domain management 里添加你的域名，按提示改 DNS
#   4) Netlify 会自动为自定义域名签发 TLS 证书（PWA 安装前提）

[build]
  # 本项目是纯静态，无需构建命令；直接发布 dist/（已剔除 .workbuddy / server.py 等开发文件）
  publish = "dist"

# 让 Service Worker 不被强缓存，保证 PWA 更新及时生效
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# 其余资源交给 Netlify 默认缓存策略即可；HTTPS / 自定义域名 TLS 由平台自动处理
